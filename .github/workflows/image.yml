# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds the container (API + web UI) and publishes it to
# ghcr.io/le-space/eigenbeleg-agent once the tests on main have passed.
# The server does not pull git: Watchtower (deploy/compose.yaml) sees the new
# :main image and replaces the container.
name: image

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  # By hand (inputs.runner), e.g. on Le Space's own one-job runner on Aleph while hosted minutes are blocked
  # (relay-button `gh-runner up --repo Le-Space/eigenbeleg-agent`).
  workflow_dispatch:
    inputs:
      runner:
        description: Where the job runs ("aleph" needs a runner started with relay-button gh-runner)
        type: choice
        options: [github, aleph]
        default: aleph

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # The repository variable CI_RUNNER=aleph builds on a one-job runner on Aleph (Docker is in its image).
    runs-on: ${{ (inputs.runner || vars.CI_RUNNER) == 'aleph' && fromJSON('["self-hosted","aleph"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the commit the tests passed on, not whatever main is by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha::12}" >> "$GITHUB_OUTPUT"
          # the commit's instant, for the footer's build stamp (never the build clock)
          echo "date=$(git show -s --format=%cI "$sha")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # The Akash proxy's URL for the page (issue #5): the repository variable AKASH_INDEXER,
          # e.g. https://eigenbeleg-akash-proxy.<account>.workers.dev; unset: no proxy.
          build-args: |
            VITE_AKASH_INDEXER=${{ vars.AKASH_INDEXER }}
            SOURCE_COMMIT=${{ github.event.workflow_run.head_sha || github.sha }}
            SOURCE_COMMIT_DATE=${{ steps.tags.outputs.date }}
          tags: |
            ${{ steps.tags.outputs.image }}:main
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
