name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pipeline's browser test runs the same code in Chromium (packages/pipeline/test/browser.test.js).
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run web:build
      - run: npm run demo
      - name: PDF/A-2b (veraPDF)
        run: docker run --rm -v "$PWD/out/demo:/data" verapdf/cli:latest --flavour 2b --format text /data/EB-2026-001.pdf /data/KA-2026-11-01.pdf | tee verapdf.txt && test "$(grep -c '^PASS' verapdf.txt)" = 2
