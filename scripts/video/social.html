<!doctype html>

<!-- The 1200×630 share card for /ui/ (Open Graph, X, LinkedIn, Telegram), in the Le Space Belege look.
     social.mjs fills the texts per language and screenshots it. Example data only. -->
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face { font-family: 'Sora'; font-weight: 100 800; src: url('../../node_modules/@fontsource-variable/sora/files/sora-latin-wght-normal.woff2') format('woff2-variations'); }
			@font-face { font-family: 'Plex'; font-weight: 400; src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
			@font-face { font-family: 'Plex'; font-weight: 500; src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }
			:root { --bg: #faf6ee; --surface: #fff; --ink: #0f1b2d; --slate: #51606f; --line: #e3dccb; --amber: #ffb020; --amber-text: #8a5a00; }
			* { box-sizing: border-box; }
			html, body { margin: 0; width: 1200px; height: 630px; background: var(--bg); color: var(--ink); font-family: 'Sora', sans-serif; -webkit-font-smoothing: antialiased; }
			.card { display: flex; justify-content: space-between; align-items: center; height: 100%; padding: 70px 80px; gap: 56px; }
			.left { flex: 1; display: flex; flex-direction: column; height: 100%; }
			.logo { display: flex; align-items: center; gap: 24px; }
			.logo svg { width: 82px; height: 82px; }
			.prefix { font-family: 'Plex'; font-size: 17px; letter-spacing: 0.32em; color: var(--slate); margin-bottom: 6px; }
			.name { font-weight: 700; font-size: 50px; letter-spacing: -0.03em; line-height: 1; }
			h1 { font-size: 58px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 700; margin: 58px 0 20px; }
			h1 em { font-style: normal; color: var(--amber-text); }
			.sub { font-size: 24px; line-height: 1.4; color: var(--slate); margin: 0; }
			.facts { margin-top: auto; font-family: 'Plex'; font-size: 17px; color: var(--slate); display: flex; gap: 26px; }
			.facts span::before { content: '·'; color: var(--amber); margin-right: 10px; }
			.right { width: 330px; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; font-family: 'Plex'; font-size: 15px; }
			.doc { font-family: 'Sora'; font-weight: 700; font-size: 18px; margin-bottom: 4px; }
			.no { color: var(--slate); margin-bottom: 16px; }
			.line { display: flex; justify-content: space-between; padding: 11px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
			.line.dash { background: transparent; border-style: dashed; color: var(--slate); }
			.badge { display: inline-block; margin-top: 10px; float: right; background: var(--amber); color: var(--ink); border-radius: 999px; padding: 5px 14px; font-weight: 500; }
		</style>
	</head>
	<body>
		<div class="card">
			<div class="left">
				<div class="logo">
					<svg viewBox="0 0 100 100" aria-hidden="true">
						<circle cx="36" cy="38" r="27" fill="none" stroke="#ffb020" stroke-width="17" />
						<path fill="#0f1b2d" fill-rule="evenodd" d="M43 47h50a9 9 0 0 1 9 9v37a9 9 0 0 1-9 9H43a9 9 0 0 1-9-9V56a9 9 0 0 1 9-9zM58 60h20a6 6 0 0 1 6 6v17a6 6 0 0 1-6 6H58a6 6 0 0 1-6-6V66a6 6 0 0 1 6-6z" />
					</svg>
					<div><div class="prefix">LE SPACE</div><div class="name">eigenbeleg</div></div>
				</div>
				<h1 id="title"></h1>
				<p class="sub" id="sub"></p>
				<div class="facts" id="facts"></div>
			</div>
			<div class="right">
				<div class="doc" id="doc"></div>
				<div class="no">EB-2026-042</div>
				<div class="line"><span id="fee"></span><span>0,0012 NEAR</span></div>
				<div class="line dash"><span>9fK3…tx7Q</span><span>0,00 €</span></div>
				<div class="line"><span id="storage"></span><span>0,05 NEAR</span></div>
				<div class="line dash"><span>Kraken VWAP</span><span>0,10 €</span></div>
				<span class="badge" id="badge"></span>
			</div>
		</div>
	</body>
</html>
